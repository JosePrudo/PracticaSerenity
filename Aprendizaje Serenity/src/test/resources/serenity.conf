serenity {
  project.name = "Aprendizaje Serenity"
  take.screenshots = FOR_FAILURES
  tag.failures = true
  report.show.step.details = true
  console.colors = true
  logging = VERBOSE
}

# ---------------------------------------------------------------
# Selenium WebDriver
# ChromeDriver local para Windows; ejecutar Maven desde la raiz del proyecto.
# Si Chrome cambia de compilacion, actualizar drivers\\chromedriver.exe.
# ---------------------------------------------------------------
webdriver {
  driver = chrome
  autodownload = false
  chrome.driver = "drivers\\chromedriver.exe"
  timeouts {
    implicitlywait = 5000
    fluentwait = 10000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "disable-infobars",
        "disable-popup-blocking",
        "disable-extensions",
        "disable-dev-shm-usage",
        "remote-allow-origins=*",
        "--disable-search-engine-choice-screen"
      ]
      excludeSwitches = ["enable-automation"]
    }
  }
}

# Se activa con -Dheadless.mode=true
headless.mode = false

environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com"
  }
  qa {
    webdriver.base.url = "https://www.saucedemo.com"
  }
}
